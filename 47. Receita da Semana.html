  <title>Receita da Semana</title>
</head>
<body>
  <h1>Receita de Omelete Rápida</h1>
  <ol>
    <li>Partir dois ovos para uma tigela.</li>
    <li>Adicionar uma pitada de sal e pimenta.</li>
    <li>Bater os ovos com um garfo até obter uma mistura homogénea.</li>
    <li>Aquecer uma frigideira com um pouco de óleo ou manteiga.</li>
    <li>Despejar os ovos na frigideira e cozinhar até dourar.</li>
  </ol>
</body>
