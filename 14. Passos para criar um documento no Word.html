      <h2>Passos para criar um documento no Word</h2>
<body>
      <ol>
          <li>Abrir o programa Microsoft Word.</li>
          <li>Selecionar "Documento em Branco".</li>
          <li>Escrever o texto pretendido no documento.</li>
         <li>Clicar em "Ficheiro" > "Guardar como" e escolher o local de destino.</li>
     </ol>
</body>
